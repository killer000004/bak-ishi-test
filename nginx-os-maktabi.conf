# /etc/nginx/sites-available/os-maktabi
# Statik sayt. HTTPS SafeLine WAF da tugaydi, bu yerga WAF dan HTTP (80) keladi.

server {
    listen 80;
    server_name __DOMAIN__;

    root /var/www/os-maktabi;
    index index.html;

    # WAF orqasidagi haqiqiy mijoz IP sini logga yozish
    set_real_ip_from __WAF_IP__;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/os-maktabi.access.log;
    error_log  /var/log/nginx/os-maktabi.error.log warn;

    server_tokens off;

    # Xavfsizlik sarlavhalari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;

    # HTML har safar yangilansin (yangi versiya darhol ko'rinadi)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Yashirin fayllarni (.git, .env) hech qachon bermaslik
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
