<title>Ma'lumotnoma platformasi demo</title>
<style>
/* Layout: haqiqiy Django saytining aynan nusxasi — ochiq sayt (header + markaziy ustun) va chap menyuli boshqaruv paneli */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #fafbfd; --ink: #141b2d; --muted: #5d6b82; --line: #dde3ec;
  --accent: #1f4fd8; --accent-ink: #ffffff; --accent-soft: #e9efff; --hero-a: #1f4fd8; --hero-b: #1a3fae;
  --side: #101a33; --side-ink: #c9d3ea; --side-dim: #8e9bbb;
  --ok: #1b7f4b; --ok-soft: #e8f6ee; --err: #c62828; --err-soft: #fdecea; --warn: #8a5300; --warn-soft: #fff4e0;
  --mark: #fff1a8; --paper: #ffffff; --paper-ink: #111111;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Times New Roman", Times, "Liberation Serif", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1424; --surface: #161e33; --surface-2: #1b2440; --ink: #e6eaf4; --muted: #9aa6c0; --line: #2a3554;
  --accent: #6b8cff; --accent-ink: #0b1020; --accent-soft: #1f2b52; --hero-a: #1c3a9e; --hero-b: #142b77;
  --side: #0a0f1d; --side-ink: #c9d3ea; --side-dim: #7f8aa8;
  --ok: #4fc58a; --ok-soft: #12301f; --err: #ff7b7b; --err-soft: #3a1717; --warn: #f0b45a; --warn-soft: #33260f;
  --mark: #5a4d0c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #161e33; --surface-2: #1b2440; --ink: #e6eaf4; --muted: #9aa6c0; --line: #2a3554;
  --accent: #6b8cff; --accent-ink: #0b1020; --accent-soft: #1f2b52; --hero-a: #1c3a9e; --hero-b: #142b77;
  --side: #0a0f1d; --side-ink: #c9d3ea; --side-dim: #7f8aa8;
  --ok: #4fc58a; --ok-soft: #12301f; --err: #ff7b7b; --err-soft: #3a1717; --warn: #f0b45a; --warn-soft: #33260f;
  --mark: #5a4d0c; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Demo tasmasi */
.demobar { background: var(--warn-soft); color: var(--warn); font-size: 13px; padding-block: 8px; padding-inline: 16px;
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; text-align: center; }
.demobar .sw { display: inline-flex; border: 1px solid currentColor; border-radius: 99px; overflow: hidden; }
.demobar .sw button { background: none; border: 0; padding: 3px 12px; cursor: pointer; color: inherit; font-size: 13px; }
.demobar .rst { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; }
.demobar .sw button.on { background: var(--warn); color: var(--warn-soft); font-weight: 600; }

/* Umumiy */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 9px;
  padding: 11px 20px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.2; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-light { background: var(--accent-soft); color: var(--accent); padding: 8px 14px; font-size: 14px; }
.btn-danger { background: var(--surface); border-color: var(--err); color: var(--err); }
.btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .6; cursor: default; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
select:disabled { opacity: .6; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
.tag.grey { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tag.ex { background: var(--warn-soft); color: var(--warn); }

/* Ochiq sayt */
.site-header { background: var(--surface); border-bottom: 1px solid var(--line); }
.site-header .in { max-width: 1080px; margin: 0 auto; padding-block: 12px; padding-inline: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 700; background: none; border: 0; cursor: pointer; padding: 0; }
.logo .mark { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 15px; flex: none; }
.logo small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; text-align: left; }
.site-footer { text-align: center; color: var(--muted); font-size: 13px; padding-block: 28px 36px; padding-inline: 16px; }
.site-footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }

.hero { background: linear-gradient(160deg, var(--hero-a) 0%, var(--hero-b) 100%); color: #fff; }
.hero .in { max-width: 1080px; margin: 0 auto; padding-block: 60px 68px; padding-inline: 16px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; }
.eyebrow { display: inline-block; background: rgba(255,255,255,.14); border-radius: 99px; padding: 5px 12px; font-size: 13px; margin-bottom: 16px; }
.hero h1 { font-size: clamp(28px, 4.2vw, 40px); line-height: 1.15; margin: 0 0 14px; letter-spacing: -.01em; text-wrap: balance; }
.hero .lead { font-size: 18px; line-height: 1.55; color: #dbe4ff; margin: 0 0 28px; max-width: 34em; }
.hero .btn { background: #fff; color: #1f4fd8; font-size: 17px; padding: 14px 26px; }
.hero .meta { margin-top: 14px; font-size: 14px; color: #c3d0ff; }
.paper-deco { background: #fff; color: #222; border-radius: 6px; padding: 22px 22px 26px; box-shadow: 0 24px 48px rgba(6,20,70,.35);
  transform: rotate(1.5deg); font-family: var(--serif); font-size: 11px; max-width: 360px; justify-self: center; width: 100%; }
.paper-deco .top { display: flex; gap: 12px; }
.paper-deco .t { flex: 1; }
.paper-deco .ttl { text-align: center; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
.paper-deco .ph { width: 56px; height: 72px; border: 1px solid #333; flex: none; }
.paper-deco .ln { height: 7px; background: #e6e8ee; border-radius: 2px; margin: 6px 0; }
.paper-deco .ln.b { background: #c9cfdb; }
.paper-deco .g { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin-top: 10px; }
.paper-deco .h { text-align: center; font-weight: bold; margin: 12px 0 6px; font-size: 12px; }
.section { max-width: 1080px; margin: 0 auto; padding-block: 52px 4px; padding-inline: 16px; }
.section h2 { font-size: 26px; margin: 0 0 8px; }
.section .sub { color: var(--muted); margin: 0 0 24px; }
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.s3, .box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.s3 .n { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; margin-bottom: 12px; }
.s3 h3, .box h3 { margin: 0 0 8px; font-size: 17px; }
.s3 p { margin: 0; color: var(--muted); line-height: 1.5; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.box ul { margin: 0; padding-left: 20px; line-height: 1.8; }
.cta { max-width: 1080px; margin: 44px auto 0; padding-inline: 16px; }
.cta .in { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.cta h3 { margin: 0; font-size: 20px; }

/* Wizard */
.wiz { max-width: 680px; margin: 0 auto; padding-block: 18px 40px; padding-inline: 16px; }
.wiz .brand { font-weight: 700; font-size: 15px; margin: 0 0 8px; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .25s; }
.counter { font-size: 13px; color: var(--muted); margin-top: 6px; }
.panel-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; margin-top: 10px; }
.q { font-size: 21px; font-weight: 700; margin: 0 0 6px; line-height: 1.3; text-wrap: balance; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.field input, .field select, .field textarea { font-size: 17px; padding: 12px 14px; }
.radio-list { display: grid; gap: 10px; }
.radio-list label { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; font-size: 16px; font-weight: 500; cursor: pointer; margin: 0; }
.radio-list label.on { border-color: var(--accent); background: var(--accent-soft); }
.radio-list input { width: auto; margin: 0; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.errmsg { color: var(--err); font-size: 14px; margin: 10px 0 0; }
.invalid { border-color: var(--err) !important; background: var(--err-soft) !important; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
.keyhint { font-size: 12px; color: var(--muted); text-align: right; margin-top: 8px; }
.rows { display: grid; gap: 12px; }
.rowcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; position: relative; background: var(--surface-2); }
.rowcard .rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rowcard .wide { grid-column: 1 / -1; }
.rowcard label { font-size: 12px; color: var(--muted); }
.rowcard .rn { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.rowcard .rm { position: absolute; top: 8px; right: 8px; border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
.rowcard .rm:hover { color: var(--err); }
.review .item { display: grid; grid-template-columns: 40% 1fr auto; gap: 10px; padding-block: 9px; border-bottom: 1px solid var(--line); font-size: 14px; }
.review .item dt { color: var(--muted); }
.review .item dd { margin: 0; font-weight: 600; white-space: pre-wrap; word-break: break-word; min-width: 0; }
.review dl { margin: 0; }
.review .edit { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
.review h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 6px; }
.review ol { margin: 0; padding-left: 18px; font-size: 14px; }
.review ol li { margin-bottom: 6px; }
.done { text-align: center; padding: 44px 20px; max-width: 560px; margin: 28px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.done .ic { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; margin: 0 auto 16px; font-size: 28px; }
.done h1 { font-size: 23px; margin: 0; }

/* Panel */
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 44px); }
.side { background: var(--side); color: var(--side-ink); padding: 18px 12px; display: flex; flex-direction: column; }
.side .brand2 { display: flex; gap: 10px; align-items: center; color: #fff; font-weight: 700; padding: 4px 8px 20px; }
.side .brand2 .mark { width: 32px; height: 32px; border-radius: 8px; background: #1f4fd8; display: grid; place-items: center; }
.side .brand2 small { display: block; color: var(--side-dim); font-weight: 500; font-size: 12px; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav button { display: flex; align-items: center; gap: 10px; color: var(--side-ink); background: none; border: 0; text-align: left; padding: 10px; border-radius: 8px; cursor: pointer; }
.side nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.side nav button.on { background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }
.side nav svg { width: 18px; height: 18px; flex: none; }
.side .bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,.08); padding-top: 12px; font-size: 13px; }
.side .bottom .who { padding: 0 10px 6px; color: var(--side-dim); }
.side .bottom button { background: none; border: 0; color: var(--side-ink); cursor: pointer; padding: 8px 10px; }
.main { padding: 26px 28px 60px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { margin: 0; font-size: 24px; }
.head p { margin: 4px 0 0; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.card h2 { font-size: 16px; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h2 button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.stat .k { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.stat .v { font-size: 30px; font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
.bars .row { display: grid; grid-template-columns: minmax(0, 1.2fr) 2fr 36px; gap: 10px; align-items: center; padding-block: 6px; font-size: 14px; }
.bars .row button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.bars .row button:hover { color: var(--accent); }
.bars .track { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--accent); }
.bars .n { text-align: right; font-weight: 600; }
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
table.t td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
.namebtn { background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; }
.namebtn:hover { color: var(--accent); }
mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }
.filters { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 14px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.acts { text-align: right; white-space: nowrap; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.err { background: var(--err-soft); color: var(--err); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
dl.kv { display: grid; grid-template-columns: 44% 1fr; gap: 9px 14px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-weight: 600; word-break: break-word; min-width: 0; }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dgrid .wide { grid-column: 1 / -1; }
.ggrid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
.ggrid .forms { display: grid; gap: 16px; }
.ggrid .forms input, .ggrid .forms select, .ggrid .forms textarea { margin-bottom: 10px; }
.fak { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 14px; overflow: hidden; }
.fak .fh { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.gchips { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; }
.gchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 4px 6px 4px 12px; font-size: 14px; }
.gchip .c { color: var(--muted); font-size: 12px; }
.x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px; }
.x:hover { color: var(--err); }
.login { min-height: 70vh; display: grid; place-items: center; background: var(--side); padding: 24px 16px; }
.login form { background: var(--surface); border-radius: 14px; padding: 30px 26px; width: 100%; max-width: 380px; display: grid; gap: 4px; }
.login .mark { width: 40px; height: 40px; border-radius: 10px; background: #1f4fd8; color: #fff; display: grid; place-items: center; font-weight: 700; margin-bottom: 10px; }
.login h1 { font-size: 21px; margin: 0; }
.login input { margin-bottom: 10px; }
.creds { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 9px 12px; font-size: 13px; margin: 8px 0 12px; }
.creds code { font-weight: 700; }

/* PDF ko'rinishi (modal) */
.modal { position: fixed; inset: 0; background: rgba(5,10,25,.6); z-index: 50; overflow-y: auto; padding-block: 24px; padding-inline: 16px; }
.modal .mbar { max-width: 210mm; margin: 0 auto 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sheet { background: var(--paper); color: var(--paper-ink); max-width: 210mm; margin: 0 auto 14px; aspect-ratio: 210 / 297; padding: 7% 5.7% 7% 9.5%;
  font-family: var(--serif); font-size: clamp(7px, 1.65vw, 12pt); line-height: 1.18; box-shadow: 0 10px 30px rgba(0,0,0,.35); overflow: hidden; }
.sheet p { margin: 0; }
.sheet .sh-head { display: flex; gap: 3%; }
.sheet .sh-head .l { flex: 1; min-width: 0; }
.sheet .sh-photo { width: 19.7%; aspect-ratio: 3.5 / 4.5; border: 1px solid #000; flex: none; }
.sheet .ttl { text-align: center; font-weight: bold; font-size: 1.17em; margin-bottom: 1em; }
.sheet .nm { text-align: center; font-weight: bold; font-size: 1.17em; }
.sheet .g2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 3%; row-gap: .4em; margin-top: .6em; }
.sheet .full { grid-column: 1 / -1; }
.sheet h4 { text-align: center; font-size: 1.17em; margin: 1em 0 .6em; }
.sheet .wk p { margin-bottom: .5em; }
.sheet table { width: 100%; border-collapse: collapse; font-size: .92em; }
.sheet th, .sheet td { border: 1px solid #000; padding: .25em .3em; text-align: center; vertical-align: middle; }
.sheet td:first-child { font-weight: bold; }

@media (max-width: 860px) {
  .hero .in { grid-template-columns: 1fr; padding-block: 40px 48px; }
  .paper-deco { display: none; }
  .steps3, .two, .stats, .grid2, .dgrid, .ggrid { grid-template-columns: 1fr 1fr; }
  .steps3, .two, .grid2, .dgrid, .ggrid { grid-template-columns: 1fr; }
  .layout { grid-template-columns: 1fr; }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; }
  .side .brand2 { padding: 4px 8px; }
  .side .brand2 small, .side nav button span, .side .bottom .who { display: none; }
  .side nav { flex-direction: row; }
  .side .bottom { margin: 0 0 0 auto; border: 0; padding: 0; }
  .main { padding: 18px 16px 50px; }
  .filters { grid-template-columns: 1fr 1fr; }
  .filters .srch { grid-column: 1 / -1; }
  .hide-m { display: none; }
}
@media (max-width: 560px) {
  .rowcard .rgrid { grid-template-columns: 1fr; }
  .review .item { grid-template-columns: minmax(0, 1fr) auto; }
  .review .item dt { grid-column: 1 / -1; }
  .q { font-size: 19px; }
  .stats { grid-template-columns: 1fr 1fr; }

}
</style>

<script>

  } else if (s.t === "mehnat") {

function inp(list, i, f, lab, val, ph) {

function filled(list) { return W.d[list].filter(function (r) { return Object.keys(r).some(function (k) { return String(r[k]).trim(); }); }); }

function validate(idx) {
  var s = STEPS[idx], d = W.d; W.bad = {}; W.err = "";
  if (!s.k) return true;
  if (s.t === "guruh") {
    if (!db.guruhlar.length) return true;
    if (!d.fakSel) { W.bad.fak = 1; W.err = "Fakultetni tanlang."; return false; }
    if (!d.guruh) { W.bad.gr = 1; W.err = "Guruhni tanlang."; return false; }
    return true;
  }
  if (s.t === "mehnat" || s.t === "qar") {
    var complete = 0, bad = false;
    d[s.k].forEach(function (r, i) {
      var keys = Object.keys(r), empty = keys.filter(function (k) { return !String(r[k]).trim(); });
      if (empty.length === keys.length) return;
      if (empty.length) { bad = true; empty.forEach(function (k) { W.bad[s.k + "-" + i + "-" + k] = 1; }); } else complete++;
    });
    if (bad) { W.err = "Qatorni to'liq to'ldiring yoki × tugmasi bilan o'chiring."; return false; }
    if (!complete) { W.err = s.k === "mehnat" ? "Kamida bitta qatorni to'liq to'ldiring." : "Kamida bitta qarindosh ma'lumotini to'liq kiriting."; return false; }
    return true;
  }
  var v = String(d[s.k] || "").trim();
  if (!v && !s.opt) { W.bad.main = 1; W.err = s.t === "radio" ? "Variantlardan birini tanlang." : "Bu savolga javob berish majburiy."; return false; }
  if (s.t === "date" && v) {
    if (+v.slice(0, 4) < 1900 || new Date(v) > new Date()) { W.bad.main = 1; W.err = "Sanani to'g'ri kiriting."; return false; }
  }
  return true;
}

    if (y + h > 282) { doc.addPage(); y = 15; }
    var x = L;
    ls.forEach(function (l, i) {
      doc.rect(x, y, cols[i], h);
      f(boldAll || (boldFirst && i === 0), 11);
      var top = y + (h - l.length * lh) / 2;
      l.forEach(function (ln, j) { doc.text(ln, x + cols[i] / 2, top + j * lh, { align: "center", baseline: "top" }); });
      x += cols[i];
    });
    y += h;
  }
  trow(heads, false, true);
  o.qar.forEach(function (q) { trow([q.rel, q.fish, q.tyj, q.ish, q.turar], true, false); });

}

function downloadPDF(o) {

// ================== Asosiy render ==================
function render() {
  var v = S.view, html;
  if (v === "bosh") html = viewBosh();
  else if (v === "toldirish") html = viewWizard();
  else if (v === "rahmat") html = viewRahmat();
  else if (!S.authed) html = viewLogin();
  else if (v === "panel") html = viewDashboard();
  else if (v === "talabalar") html = viewTalabalar();
  else if (v === "detail") html = viewDetail();
  else if (v === "guruhlar") html = viewGuruhlar();
  else html = viewBosh();
  $("#app").innerHTML = demobar() + html;
  if (v === "toldirish" && window.innerWidth > 700) {
    var first = $("#wizform input:not([type=radio]), #wizform textarea, #wizform select:not([disabled])");
    if (first) first.focus({ preventScroll: true });
  }
}

// ================== Hodisalar ==================
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var a = b.dataset.act, id = +b.dataset.id;
  if (b.tagName === "BUTTON" && b.type !== "submit") e.preventDefault();
  if (a === "to-site") { $("#modal").innerHTML = ""; go("bosh"); }
  else if (a === "to-panel") { $("#modal").innerHTML = ""; go(S.authed ? "panel" : "panel"); }
  else if (a === "start") { if (!W.d) loadDraft(); W.err = ""; W.bad = {}; go("toldirish"); }
  else if (a === "prev") { W.i = Math.max(0, W.i - 1); W.err = ""; W.bad = {}; saveDraft(); render(); }
  else if (a === "goto") { W.i = +b.dataset.i; W.err = ""; W.bad = {}; saveDraft(); render(); }
  else if (a === "chip") { var s = STEPS[W.i]; W.d[s.k] = b.dataset.v; W.err = ""; W.bad = {}; saveDraft(); render(); }
  else if (a === "add-row") { var L = b.dataset.list; W.d[L].push(L === "mehnat" ? { davr: "", tavsif: "" } : { rel: "", fish: "", tyj: "", ish: "", turar: "" }); saveDraft(); render(); }
  else if (a === "rm-row") { var L2 = b.dataset.list; W.d[L2].splice(+b.dataset.i, 1); if (!W.d[L2].length) W.d[L2].push(L2 === "mehnat" ? { davr: "", tavsif: "" } : { rel: "", fish: "", tyj: "", ish: "", turar: "" }); W.bad = {}; W.err = ""; saveDraft(); render(); }
  else if (a === "nav") { go(b.dataset.v); }
  else if (a === "reset") {
    if (!S.confirmReset) { S.confirmReset = true; render(); setTimeout(function () { if (S.confirmReset) { S.confirmReset = false; render(); } }, 4000); return; }
    S.confirmReset = false; db = seed(); save(); clearDraft(); W.d = null; W.i = 0; S.authed = false; S.q = S.fakF = S.grF = ""; go("bosh");
  }
  else if (a === "logout") { S.authed = false; go("panel"); }
  else if (a === "open") { go("detail", { detail: id }); }
  else if (a === "view") { openPreview(db.items.filter(function (x) { return x.id === id; })[0]); }
  else if (a === "pdf") { downloadPDF(db.items.filter(function (x) { return x.id === id; })[0]); }
  else if (a === "close") { $("#modal").innerHTML = ""; }
  else if (a === "zip") { flash("warn", "ZIP yuklab olish haqiqiy saytda ishlaydi: PDF'lar guruhlar bo'yicha papkalarga joylanadi. Demo'da har birini alohida yuklab oling."); render(); }
  else if (a === "clear-f") { S.q = ""; S.fakF = ""; S.grF = ""; render(); }
  else if (a === "filter-g") { S.q = ""; S.grF = b.dataset.v; var g = guruh(+b.dataset.v); S.fakF = g ? String(g.fak) : ""; go("talabalar"); }
  else if (a === "del") { S.confirmDel = true; render(); }
  else if (a === "del-no") { S.confirmDel = false; render(); }
  else if (a === "del-yes") { var it = db.items.filter(function (x) { return x.id === id; })[0]; db.items = db.items.filter(function (x) { return x.id !== id; }); save(); flash("ok", (it ? it.fish : "") + " — ma'lumotnoma o'chirildi."); go("talabalar"); }
  else if (a === "del-g") {
    var gg = guruh(id), n = countIn(id);
    if (n) flash("err", '"' + gg.nomi + '" guruhida ' + n + " ta ma'lumotnoma bor — o'chirib bo'lmaydi.");
    else { db.guruhlar = db.guruhlar.filter(function (x) { return x.id !== id; }); save(); flash("ok", '"' + gg.nomi + '" guruhi o\'chirildi.'); }
    render();
  }
  else if (a === "del-fak") {
    var ff = fak(id), gids = db.guruhlar.filter(function (g) { return g.fak === id; }).map(function (g) { return g.id; });
    var n2 = db.items.filter(function (it) { return gids.indexOf(it.guruh) >= 0; }).length;
    if (n2) flash("err", '"' + ff.nomi + '" fakultetida ' + n2 + " ta ma'lumotnoma bor — o'chirib bo'lmaydi.");
    else { db.faks = db.faks.filter(function (x) { return x.id !== id; }); db.guruhlar = db.guruhlar.filter(function (g) { return g.fak !== id; }); save(); flash("ok", '"' + ff.nomi + '" fakulteti o\'chirildi.'); }
    render();
  }
});
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.closest("#wizform")) {
    if (t.dataset.list) W.d[t.dataset.list][+t.dataset.i][t.dataset.f] = t.value;
    else if (t.dataset.k && t.type !== "radio" && t.tagName !== "SELECT") W.d[t.dataset.k] = t.value;
    if (t.classList.contains("invalid")) t.classList.remove("invalid");
    saveDraft();
  }
});
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.closest("#wizform")) {
    if (t.type === "radio") { W.d[t.dataset.k] = t.value; W.err = ""; W.bad = {}; saveDraft(); render(); }
    else if (t.tagName === "SELECT" && t.dataset.k === "fakSel") { W.d.fakSel = t.value; W.d.guruh = ""; W.err = ""; W.bad = {}; saveDraft(); render(); var g = $("#f-gr"); if (g && !g.disabled) g.focus(); }
    else if (t.tagName === "SELECT" && t.dataset.k === "guruh") { W.d.guruh = t.value; saveDraft(); }
    else if (t.tagName === "SELECT" && t.dataset.list) { W.d[t.dataset.list][+t.dataset.i][t.dataset.f] = t.value; saveDraft(); }
  } else if (t.id === "ff") { S.fakF = t.value; S.grF = ""; S.q = $("#q").value; render(); }
  else if (t.id === "gf") { S.grF = t.value; S.q = $("#q").value; render(); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && $("#modal").innerHTML) { $("#modal").innerHTML = ""; return; }
  if (e.key !== "Enter") return;
  var t = e.target;
  if (t.closest && t.closest("#wizform") && t.tagName === "TEXTAREA" && e.shiftKey) return;
  if (t.closest && t.closest("#wizform") && t.tagName === "TEXTAREA") { e.preventDefault(); $("#wizform").requestSubmit(); }
});
document.addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target;
  if (f.id === "wizform") {
    var s = STEPS[W.i];
    if (s.t === "review") {
      for (var k = 1; k < STEPS.length - 1; k++) { if (!validate(k)) { W.i = k; render(); return; } }
      var d = W.d, it = { id: db.nextId++, yaratilgan: new Date().toISOString(), guruh: d.guruh ? +d.guruh : null, mehnat: filled("mehnat"), qar: filled("qar") };
      STEPS.forEach(function (st) { if (st.k && st.t !== "mehnat" && st.t !== "qar" && st.t !== "guruh") it[st.k] = String(d[st.k] || "").trim(); });
      db.items.push(it); save(); clearDraft(); W.d = null; W.i = 0; go("rahmat");
      return;
    }
    if (validate(W.i)) { W.i++; W.err = ""; W.bad = {}; saveDraft(); }
    render(); return;
  }
  if (f.id === "loginform") {
    if ($("#lg-u").value.trim() === "admin" && $("#lg-p").value === "demo123") { S.authed = true; S.loginErr = false; go(S.view === "detail" ? "panel" : S.view); }
    else { S.loginErr = true; render(); }
    return;
  }
  if (f.id === "filterform") { S.q = $("#q").value; render(); var q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } return; }
  if (f.id === "addfak") {
    var nm = $("#fn").value.trim();
    if (!nm) flash("err", "Fakultet nomini kiriting.");
    else if (db.faks.some(function (x) { return x.nomi.toLowerCase() === nm.toLowerCase(); })) flash("err", '"' + nm + '" fakulteti allaqachon bor.');
    else { db.faks.push({ id: db.nextId++, nomi: nm }); save(); flash("ok", '"' + nm + '" fakulteti qo\'shildi.'); }
    render(); return;
  }
  if (f.id === "addgr") {
    var fid = +$("#gfk").value, names = $("#gn").value.split(/[\n,]/).map(function (x) { return x.trim(); }).filter(Boolean);
    if (!names.length) { flash("err", "Kamida bitta guruh nomini yozing."); render(); return; }
    var have = db.guruhlar.filter(function (g) { return g.fak === fid; }).map(function (g) { return g.nomi; }), added = 0;
    names.forEach(function (n) { if (have.indexOf(n) < 0) { db.guruhlar.push({ id: db.nextId++, fak: fid, nomi: n }); have.push(n); added++; } });
    save(); flash("ok", fak(fid).nomi + ": " + added + " ta guruh qo'shildi." + (added < names.length ? " Takrorlanganlari o'tkazib yuborildi." : "")); render(); return;
  }
});
